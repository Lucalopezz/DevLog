services:
  database:
    image: postgres:17-alpine
    container_name: devlog-database
    restart: no

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - devlog_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  database-test:
    image: postgres:17-alpine
    container_name: devlog-database-test
    restart: no

    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-devlog_test}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"

    volumes:
      - devlog_postgres_test_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_TEST_DB:-devlog_test}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devlog_postgres_data:
  devlog_postgres_test_data:
